name: fim
channels:
  - conda-forge
dependencies:
  - python=3.11

  # Core data & geospatial
  - pandas
  - numpy
  - geopandas
  - shapely
  - fiona
  - pyproj
  - rasterio

  # Scientific
  - scipy
  - scikit-learn

  # numba / llvmlite (needed by fimserve)
  - numba
  - llvmlite

  # Cloud / zarr
  - xarray
  - zarr
  - s3fs
  - fsspec

  # Visualization
  - matplotlib

  # Networking
  - requests

  # Config
  - pyyaml

  # Pip-only packages
  - pip
  - pip:
      - fimserve
      - hsclient
